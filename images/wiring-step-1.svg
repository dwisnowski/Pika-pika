<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="360" viewBox="0 0 800 360">
  <rect width="800" height="360" fill="#fff"/>
  <text x="40" y="48" font-size="20" font-weight="700">Step 1 — Connect ADS1115 to Raspberry Pi (VCC, GND, SDA, SCL)</text>
  <rect x="48" y="72" width="320" height="160" rx="8" fill="#e6f2ff" stroke="#1a73e8"/>
  <text x="64" y="96" font-size="14">Raspberry Pi header (Pin 1: 3.3V, Pin 3: SDA, Pin 5: SCL, Pin 6: GND)</text>
  <rect x="420" y="96" width="320" height="120" rx="8" fill="#fff7e6" stroke="#ff8c00"/>
  <text x="436" y="120" font-size="14">ADS1115 (VCC → 3.3V, GND → GND, SDA → SDA, SCL → SCL)</text>
  <line x1="180" y1="160" x2="420" y2="150" stroke="#1a73e8" stroke-width="3" stroke-linecap="round"/>
  <text x="270" y="150" font-size="12">SDA/SCL</text>
  <rect x="48" y="248" width="692" height="80" rx="6" fill="#f8f9fb" stroke="#ddd"/>
  <text x="64" y="276" font-size="12">Tip: Use short, well-insulated jumper wires and double-check VCC voltage (3.3V for ADS1115).</text>
</svg>