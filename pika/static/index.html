<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pika-pika Live Monitor</title>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Chart.js date adapter (required for time scales) -->
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3.0.0/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
    <!-- Chart zoom plugin -->
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.0.1/dist/chartjs-plugin-zoom.min.js"></script>

    <!-- Material CSS (we use a simple CSS file with Material-like dark theme) -->
    <link rel="stylesheet" href="/static/material.css">

    <!-- Favicons and manifest -->
    <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/static/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon.png">
    <link rel="icon" href="/static/favicon.ico" type="image/x-icon" />

    <!-- Open Graph / Social preview (use PNG/WebP if available) -->
    <meta property="og:title" content="Pika-pika" />
    <meta property="og:description" content="Python-based Raspberry Pi voltage logger and live web viewer." />
    <meta property="og:image" content="/static/Pika-pika.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="/static/Pika-pika.png" />

    <style>
      /* Ensure the page padding but keep dark theme */
      body { font-family: 'Roboto', 'Noto Sans', sans-serif; margin: 18px; }
      #chartwrap { max-width: 900px; }
    </style>
  </head>
  <body>
    <div class="header" style="gap:18px;align-items:center;">
      <img src="/static/Pika-pika.png" alt="Pika-pika logo" width="72" height="72" style="border-radius:8px;"/>
      <div>
        <h2 style="margin:0">Pika-pika Live Voltage Monitor</h2>
        <p style="margin:2px 0 0 0; font-size:90%">Shows recent sampled values (live). Data is sampled at 100 Hz and stored on the device.</p>
      </div>
    </div>

    <div style="margin-top:8px;display:flex;gap:8px;">
      <a href="/" class="btn">Live</a>
      <a href="/demo" class="btn">Demo</a>
      <a href="/history" class="btn">History</a>
    </div>

    <div style="display:flex;gap:24px;align-items:center;flex-wrap:wrap;">
      <div id="chartwrap" style="flex:1;min-width:320px;max-width:900px;">
        <div style="display:flex;gap:12px;align-items:center;margin-bottom:8px;flex-wrap:wrap;">
          <div style="display:flex;gap:12px;align-items:center;">
            <label for="sampleRate" style="font-size:14px;">Sample Rate:</label>
            <input type="number" id="sampleRate" min="1" max="100" step="1" style="width:80px;padding:4px;border:1px solid #ccc;border-radius:4px;">
            <span>Hz</span>
            <button id="updateRateBtn" class="btn" style="font-size:12px;padding:4px 8px;">Update</button>
            <span id="currentRate" style="font-size:12px;color:#666;"></span>
          </div>
          <div style="display:flex;gap:8px;align-items:center;margin-left:16px;">
            <label style="font-size:14px;">Time Window:</label>
            <label style="font-size:12px;cursor:pointer;"><input type="radio" name="timeWindow" value="10" style="margin-right:4px;">10s</label>
            <label style="font-size:12px;cursor:pointer;"><input type="radio" name="timeWindow" value="30" style="margin-right:4px;">30s</label>
            <label style="font-size:12px;cursor:pointer;"><input type="radio" name="timeWindow" value="60" checked style="margin-right:4px;">60s</label>
            <label style="font-size:12px;cursor:pointer;"><input type="radio" name="timeWindow" value="300" style="margin-right:4px;">5min</label>
            <label style="font-size:12px;cursor:pointer;"><input type="radio" name="timeWindow" value="600" style="margin-right:4px;">10min</label>
          </div>
        </div>
        <canvas id="chart" width="900" height="300"></canvas>
      </div>

      <div id="qrbox" style="width:200px;flex:0 0 200px;text-align:center;">
        <h4 style="margin:0 0 8px 0">Scan to open</h4>
        <div id="qrcode"></div>
        <div style="margin-top:8px;font-size:12px;word-break:break-all; color: var(--muted);" id="qurl"></div>
        <button id="copyBtn" class="btn primary" style="margin-top:8px;">Copy URL</button>
        <div style="margin-top:6px;font-size:12px;color:var(--muted);">Scan this QR code to open the same UI on another device</div>
      </div>
    </div>

    <div id="highlightsPanel" style="margin-top:18px; display:flex; gap:16px; align-items:flex-start;">
      <div style="flex:1;">
        <h4 style="margin:6px 0">Live Voltage</h4>
        <div id="chartwrap_small" style="max-width:900px;" class="card"></div>
      </div>
      <div style="width:320px;flex:0 0 320px;">
        <h4 style="margin:6px 0">Highlights</h4>
        <div id="highlightsList" class="card" style="font-family:monospace; font-size:13px; max-height:420px; overflow:auto; padding:6px;"></div>
        <button id="resetView" class="btn primary" style="margin-top:8px;">Reset View</button>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.0.1/dist/chartjs-plugin-zoom.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>
    <script>
      const ctx = document.getElementById('chart').getContext('2d');

      // plugin to draw shaded rectangles for highlight durations
      const highlightPlugin = {
        id: 'highlightPlugin',
        afterDraw: (chart, args, options) => {
          const highlights = window._highlightsCache || [];
          if (!highlights.length) return;
          const xScale = chart.scales['x'];
          const ctx = chart.ctx;
          const top = chart.chartArea.top;
          const bottom = chart.chartArea.bottom;
          ctx.save();
          ctx.globalAlpha = 0.08;
          ctx.fillStyle = 'rgb(220,20,60)';
          highlights.forEach(h => {
            const x1 = xScale.getPixelForValue(new Date(h.start_ts * 1000));
            const x2 = xScale.getPixelForValue(new Date(h.end_ts * 1000));
            // draw rectangle
            ctx.fillRect(x1, top, Math.max(1, x2 - x1), bottom - top);
          });
          ctx.restore();
        }
      };

      // Apply Chart.js dark colors
      Chart.defaults.color = '#eaeaea';
      Chart.defaults.backgroundColor = 'transparent';

      const chart = new Chart(ctx, {
        type: 'line',
        data: { labels: [], datasets: [
          { label: 'Voltage', data: [], borderColor: '#90CAF9', backgroundColor: 'rgba(144,202,249,0.06)', tension: 0.1, pointRadius: 0 },
          { label: 'Anomalies', data: [], borderColor: '#FF6B6B', backgroundColor: '#FF6B6B', showLine: false, pointRadius: 5 }
        ] },
        options: {
          animation: false,
          plugins: {
            zoom: {
              pan: { enabled: true, mode: 'x', modifierKey: 'ctrl' },
              zoom: { wheel: { enabled: true }, mode: 'x', pinch: { enabled: true }, onZoomComplete: ({chart}) => onRangeChanged(chart) }
            }
          },
          scales: { x: { type: 'time', time: { unit: 'second', tooltipFormat: 'HH:mm:ss.SSS' }, ticks: { color: '#d0d0d0' }, grid: { color: 'rgba(255,255,255,0.04)' } }, y: { suggestedMin: 0, suggestedMax: 3.3, ticks: { color: '#d0d0d0' }, grid: { color: 'rgba(255,255,255,0.04)' } } }
        },
        plugins: [highlightPlugin]
      });

      // helper to render highlights list
      function renderHighlightsList(highlights) {
        const container = document.getElementById('highlightsList');
        container.innerHTML = '';
        if (!highlights || !highlights.length) {
          container.innerText = 'No anomalies detected.';
          return;
        }
        highlights.sort((a,b) => b.score - a.score);
        highlights.forEach((h, idx) => {
          const el = document.createElement('div');
          el.style.padding = '6px';
          el.style.borderBottom = '1px solid #eee';
          const start = new Date(h.start_ts * 1000).toLocaleString();
          const end = new Date(h.end_ts * 1000).toLocaleString();
          el.innerHTML = `<strong>#${idx+1}</strong> <br/>Peak: ${h.peak_value.toFixed(3)} @ ${new Date(h.peak_ts*1000).toLocaleTimeString()}<br/><small>${start} → ${end}</small>`;
          el.style.cursor = 'pointer';
          el.addEventListener('click', () => focusOnHighlight(h));
          container.appendChild(el);
        });
      }

      function focusOnHighlight(h) {
        // zoom x axis to highlight ± window
        const peak = h.peak_ts * 1000;
        const width = Math.max((h.end_ts - h.start_ts) * 1000 * 2, 10000); // at least 10s window
        chart.options.scales.x.min = new Date(peak - width/2);
        chart.options.scales.x.max = new Date(peak + width/2);
        // add a temporary vertical marker dataset
        chart.data.datasets[2] = chart.data.datasets[2] || { type: 'line', label: 'Marker', data: [], borderColor: 'black', borderWidth: 1, pointRadius: 0, fill: false };
        chart.data.datasets[2].data = [{x: new Date(peak), y: null}, {x: new Date(peak), y: null}];
        // rely on plugin to draw shaded region; cache highlights for plugin
        window._highlightsCache = [h];
        chart.update();
      }

      document.getElementById('resetView').addEventListener('click', () => {
        chart.options.scales.x.min = undefined;
        chart.options.scales.x.max = undefined;
        window._highlightsCache = window._highlightsCacheAll || [];
        chart.update();
      });

      // When zoom/pan changes the visible range, request aggregated data for that range
      async function fetchRange(startMs, endMs) {
        const start = Math.floor(startMs / 1000);
        const end = Math.floor(endMs / 1000);
        // request up to 3000 points for a responsive view
        const maxp = 3000;
        try {
          const res = await fetch(`/api/range?start=${start}&end=${end}&max_points=${maxp}`);
          const payload = await res.json();
          const data = payload.data || [];
          chart.data.labels = data.map(d => new Date(d[0]*1000));
          chart.data.datasets[0].data = data.map(d => ({x: new Date(d[0]*1000), y: d[1]}));
          chart.update();
        } catch (e) {
          console.error('range fetch error', e);
        }
      }

      function onRangeChanged(chartInstance) {
        const xscale = chartInstance.scales.x;
        const min = xscale.min; // ms
        const max = xscale.max; // ms
        if (min != null && max != null) {
          // if zoomed to more than a small window, fetch aggregated data
          fetchRange(min, max);
        }
      }

      // WebSocket connection for real-time updates
      let websocket = null;
      let liveMode = true;
      let reconnectAttempts = 0;
      const maxReconnectAttempts = 5;
      let selectedTimeWindow = 60; // Default to 60 seconds

      // Load time window from localStorage or use default
      function loadTimeWindow() {
        const saved = localStorage.getItem('pika-time-window');
        if (saved) {
          selectedTimeWindow = parseInt(saved, 10);
          const radio = document.querySelector(`input[name="timeWindow"][value="${selectedTimeWindow}"]`);
          if (radio) {
            radio.checked = true;
          }
        }
        applyTimeWindowFilter();
      }

      // Save time window to localStorage
      function saveTimeWindow(seconds) {
        selectedTimeWindow = seconds;
        localStorage.setItem('pika-time-window', seconds.toString());
        applyTimeWindowFilter();
      }

      // Apply time window filter to chart data
      function applyTimeWindowFilter() {
        const now = Date.now();
        const cutoff = now - (selectedTimeWindow * 1000);

        // Filter existing data
        const filteredLabels = [];
        const filteredData = [];
        for (let i = 0; i < chart.data.labels.length; i++) {
          const labelTime = chart.data.labels[i].getTime();
          if (labelTime >= cutoff) {
            filteredLabels.push(chart.data.labels[i]);
            filteredData.push(chart.data.datasets[0].data[i]);
          }
        }

        chart.data.labels = filteredLabels;
        chart.data.datasets[0].data = filteredData;

        // Filter highlights within the window
        if (window._highlightsCacheAll) {
          const filteredHighlights = window._highlightsCacheAll.filter(h => {
            const highlightStart = h.start_ts * 1000;
            const highlightEnd = h.end_ts * 1000;
            return highlightEnd >= cutoff && highlightStart <= now;
          });
          window._highlightsCache = filteredHighlights;
          renderHighlightsList(filteredHighlights);

          // Update anomaly points
          const anomalyPoints = [];
          filteredHighlights.forEach(h => {
            anomalyPoints.push({ x: new Date(h.peak_ts * 1000), y: h.peak_value });
          });
          chart.data.datasets[1].data = anomalyPoints;
        }

        chart.update();
      }

      // Check if a timestamp is within the current time window
      function isWithinTimeWindow(timestamp) {
        const now = Date.now();
        const cutoff = now - (selectedTimeWindow * 1000);
        return timestamp >= cutoff;
      }

      // Set up time window radio button listeners
      document.querySelectorAll('input[name="timeWindow"]').forEach(radio => {
        radio.addEventListener('change', function() {
          if (this.checked) {
            saveTimeWindow(parseInt(this.value, 10));
            // Reload recent data for the new window
            if (websocket && websocket.readyState === WebSocket.OPEN) {
              // Request fresh data by reconnecting or fetching
              fetchRecentForWindow();
            } else {
              fetchRecentForWindow();
            }
          }
        });
      });

      // Fetch recent data for the current time window
      async function fetchRecentForWindow() {
        try {
          const res = await fetch(`/api/recent?seconds=${selectedTimeWindow}`);
          const payload = await res.json();
          const data = payload.data || [];
          chart.data.labels = data.map(d => new Date(d[0]*1000));
          chart.data.datasets[0].data = data.map(d => ({x: new Date(d[0]*1000), y: d[1]}));

          // Update highlights
          try {
            const hr = await fetch('/api/highlights');
            const hjson = await hr.json();
            const highlights = hjson.highlights || [];
            window._highlightsCacheAll = highlights;
            
            // Filter highlights for current window
            const now = Date.now() / 1000;
            const cutoff = now - selectedTimeWindow;
            const filteredHighlights = highlights.filter(h => {
              return h.end_ts >= cutoff && h.start_ts <= now;
            });
            window._highlightsCache = filteredHighlights;
            renderHighlightsList(filteredHighlights);

            const anomalyPoints = [];
            filteredHighlights.forEach(h => {
              anomalyPoints.push({ x: new Date(h.peak_ts * 1000), y: h.peak_value });
            });
            chart.data.datasets[1].data = anomalyPoints;
          } catch (e) {
            console.error('highlights fetch error', e);
          }

          chart.update();
        } catch (e) {
          console.error('fetch error', e);
        }
      }

      function connectWebSocket() {
        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const wsUrl = `${protocol}//${window.location.host}/ws/live`;

        websocket = new WebSocket(wsUrl);

        websocket.onopen = function(event) {
          console.log('WebSocket connected');
          reconnectAttempts = 0;
        };

        websocket.onmessage = function(event) {
          try {
            const message = JSON.parse(event.data);

            if (message.type === 'recent_data') {
              // Initial data load - filter by time window
              const data = message.data || [];
              const now = Date.now() / 1000;
              const cutoff = now - selectedTimeWindow;
              const filtered = data.filter(d => d[0] >= cutoff);
              
              chart.data.labels = filtered.map(d => new Date(d[0]*1000));
              chart.data.datasets[0].data = filtered.map(d => ({x: new Date(d[0]*1000), y: d[1]}));
              chart.update();

            } else if (message.type === 'new_sample' && liveMode) {
              // Real-time sample update - filter by time window
              const [ts, val] = message.data;
              const timestamp = ts * 1000; // Convert to milliseconds

              if (isWithinTimeWindow(timestamp)) {
                const newPoint = {x: new Date(timestamp), y: val};

                // Add to chart data
                chart.data.labels.push(new Date(timestamp));
                chart.data.datasets[0].data.push(newPoint);

                // Remove old data outside the time window
                const cutoff = Date.now() - (selectedTimeWindow * 1000);
                while (chart.data.labels.length > 0 && chart.data.labels[0].getTime() < cutoff) {
                  chart.data.labels.shift();
                  chart.data.datasets[0].data.shift();
                }

                chart.update();
              } else {
                // Sample is outside window, but check if we need to remove old data
                applyTimeWindowFilter();
              }

            } else if (message.type === 'highlights') {
              // Highlights update - filter by time window
              const highlights = message.highlights || [];
              window._highlightsCacheAll = highlights;

              // Filter highlights for current window
              const now = Date.now() / 1000;
              const cutoff = now - selectedTimeWindow;
              const filteredHighlights = highlights.filter(h => {
                return h.end_ts >= cutoff && h.start_ts <= now;
              });
              window._highlightsCache = filteredHighlights;
              renderHighlightsList(filteredHighlights);

              const anomalyPoints = [];
              filteredHighlights.forEach(h => {
                anomalyPoints.push({ x: new Date(h.peak_ts * 1000), y: h.peak_value });
              });
              chart.data.datasets[1].data = anomalyPoints;
              chart.update();

            } else if (message.type === 'config_update') {
              // Configuration update
              if (message.config && message.config.sample_hz) {
                updateSampleRateDisplay(message.config.sample_hz);
              }

            } else if (message.type === 'ping') {
              // Keep-alive ping, ignore
            }
          } catch (e) {
            console.error('WebSocket message error:', e);
          }
        };

        websocket.onclose = function(event) {
          console.log('WebSocket disconnected');
          if (reconnectAttempts < maxReconnectAttempts) {
            reconnectAttempts++;
            console.log(`Reconnecting... (attempt ${reconnectAttempts}/${maxReconnectAttempts})`);
            setTimeout(connectWebSocket, 1000 * reconnectAttempts); // Exponential backoff
          } else {
            console.log('Max reconnection attempts reached, falling back to polling');
            // Fall back to polling mode
            setInterval(() => {
              if (liveMode) fetchRecentLive();
            }, 1000); // Poll every second instead of 100ms
          }
        };

        websocket.onerror = function(error) {
          console.error('WebSocket error:', error);
        };
      }

      // Fallback polling function (used if WebSocket fails)
      async function fetchRecentLive() {
        try {
          const res = await fetch(`/api/recent?seconds=${selectedTimeWindow}`);
          const payload = await res.json();
          const data = payload.data || [];
          chart.data.labels = data.map(d => new Date(d[0]*1000));
          chart.data.datasets[0].data = data.map(d => ({x: new Date(d[0]*1000), y: d[1]}));

          // Update highlights
          try {
            const hr = await fetch('/api/highlights');
            const hjson = await hr.json();
            const highlights = hjson.highlights || [];
            window._highlightsCacheAll = highlights;

            // Filter highlights for current window
            const now = Date.now() / 1000;
            const cutoff = now - selectedTimeWindow;
            const filteredHighlights = highlights.filter(h => {
              return h.end_ts >= cutoff && h.start_ts <= now;
            });
            window._highlightsCache = filteredHighlights;
            renderHighlightsList(filteredHighlights);

            const anomalyPoints = [];
            filteredHighlights.forEach(h => {
              anomalyPoints.push({ x: new Date(h.peak_ts * 1000), y: h.peak_value });
            });
            chart.data.datasets[1].data = anomalyPoints;
          } catch (e) {
            console.error('highlights fetch error', e);
          }

          chart.update();
        } catch (e) {
          console.error('fetch error', e);
        }
      }

      // Load current configuration
      async function loadConfig() {
        try {
          const response = await fetch('/api/config');
          const config = await response.json();
          updateSampleRateDisplay(config.sample_hz);
          document.getElementById('sampleRate').value = config.sample_hz;
        } catch (e) {
          console.error('Failed to load config:', e);
        }
      }

      function updateSampleRateDisplay(rate) {
        document.getElementById('currentRate').textContent = `Current: ${rate} Hz`;
      }

      // Handle sample rate update
      document.getElementById('updateRateBtn').addEventListener('click', async () => {
        const input = document.getElementById('sampleRate');
        const newRate = parseInt(input.value);

        if (isNaN(newRate) || newRate < 1 || newRate > 100) {
          alert('Sample rate must be between 1 and 100 Hz');
          input.value = input.defaultValue;
          return;
        }

        try {
          const response = await fetch('/api/config/sample-rate', {
            method: 'PUT',
            headers: {
              'Content-Type': 'application/json',
            },
            body: JSON.stringify({ sample_hz: newRate })
          });

          const result = await response.json();
          if (result.success) {
            updateSampleRateDisplay(result.sample_hz);
            alert(`Sample rate updated to ${result.sample_hz} Hz`);
          } else {
            alert('Failed to update sample rate: ' + (result.message || 'Unknown error'));
          }
        } catch (e) {
          console.error('Failed to update sample rate:', e);
          alert('Failed to update sample rate');
        }
      });

      // Load time window preference and initialize
      loadTimeWindow();

      // Connect to WebSocket and load config
      connectWebSocket();
      loadConfig();

      // Double click to toggle live mode and reset zoom
      document.getElementById('chart').addEventListener('dblclick', () => {
        liveMode = true;
        chart.options.scales.x.min = undefined;
        chart.options.scales.x.max = undefined;
        window._highlightsCache = window._highlightsCacheAll || [];
        chart.update();
      });

      // When user zooms/pans, disable live mode
      chart.options.plugins.zoom.onZoomComplete = ({chart}) => {
        liveMode = false;
        onRangeChanged(chart);
      };
      chart.options.plugins.zoom.onPanComplete = ({chart}) => {
        liveMode = false;
        onRangeChanged(chart);
      };


      // QR code and copy URL
      (function setupQR() {
        const origin = window.location.origin;
        const qurl = document.getElementById('qurl');
        const qrbox = document.getElementById('qrcode');
        const copyBtn = document.getElementById('copyBtn');

        qurl.textContent = origin;
        // create a canvas and render QR
        const canvas = document.createElement('canvas');
        qrbox.appendChild(canvas);
        if (window.QRCode && QRCode.toCanvas) {
          QRCode.toCanvas(canvas, origin, { width: 160 }, function (err) {
            if (err) console.error(err);
          });
        } else {
          // fallback to img-based API
          const img = document.createElement('img');
          img.src = 'https://api.qrserver.com/v1/create-qr-code/?size=160x160&data=' + encodeURIComponent(origin);
          qrbox.appendChild(img);
        }

        copyBtn.addEventListener('click', async () => {
          try {
            await navigator.clipboard.writeText(origin);
            copyBtn.textContent = 'Copied!';
            setTimeout(() => copyBtn.textContent = 'Copy URL', 1500);
          } catch (e) {
            console.error('copy failed', e);
            copyBtn.textContent = 'Copy failed';
            setTimeout(() => copyBtn.textContent = 'Copy URL', 1500);
          }
        });
      })();
    </script>
  </body>
</html>
