sampling:
  nominal_rate_hz: 10000
  channels: 8

decimation:
  normal_rate: 1000          # store 1/1000th of samples

anomalies:
  sag:
    threshold_pct: -10
    min_duration_ms: 8
  swell:
    threshold_pct: 10
    min_duration_ms: 8

event_window:
  pre_event_sec: 0.5
  post_event_sec: 0.5

storage:
  max_decimated_mb: 20      # rotate decimated.bin when it exceeds this
  max_events_mb: 20         # rotate events.bin when it exceeds this

debounce:
  sag_cooldown_ms: 1000
  swell_cooldown_ms: 1000
  spike_cooldown_ms: 1000

detection:
  rms_window_cycles: 30      # RMS window = N full 60Hz AC cycles
  learn_cycles: 300          # auto-learn nominal VRMS from first N cycles (~5s at 60Hz)
  ac_freq_hz: 60             # mains frequency (60 for NA, 50 for EU)

sensor:
  adc_vref: 5.0              # AD7606 input range (+/-5V)
  adc_bits: 16
  transformer_ratio: 110.3   # Changed from 120.0 to compensate for the op-amp clipping shape factor   # ZMPT101B: mains / adc_output_amplitude
  active_channels: 1         # only ch0 in use; events store this many channels

buffers:
  ram_flush_mb: 64
