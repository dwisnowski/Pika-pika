# Pika Configuration
# Single source of truth for all Pika components (datalogger and webapp)

# Sampling Configuration
sampling:
  nominal_rate_hz: 10000     # ADC sampling rate in Hz (0 = free-run / max-rate)

# Storage Configuration
storage:
  decimation:
    target_output_rate_hz: 5   # IEC 61000-4-30 base ≈ 12 cycles @ 60 Hz (informational;
                               # datalogger derives rate from detection.ac_freq_hz)
    max_mb: 20                 # Rotate decimated.bin when it exceeds this
  events:
    pre_sec: 0.5              # Seconds of data before event
    post_sec: 0.5             # Seconds of data after event
    max_mb: 20                # Rotate events.bin when it exceeds this

# Debounce Configuration
debounce:
  sag_cooldown_ms: 1000
  swell_cooldown_ms: 1000
  spike_cooldown_ms: 1000

# Buffer Configuration
buffers:
  ram_flush_mb: 64

# Sensor Configuration
sensor:
  # AD7606 ADC Configuration
  adc_vref: 5                 # AD7606 input range (+/-5V)
  adc_bits: 16                # 16-bit signed ADC
  
  # ZMPT101B Sensor Configuration
  transformer_ratio: 45200    # Fallback ratio for the currently installed ZMPT101B
                              # This value is used as fallback only; system learns actual ratio
  target_mains_vrms: 120.0    # Known steady-state voltage used for startup calibration
                              # (North American residential L-N nominal)
  
  # Channel Configuration (per-channel enable flags)
  active_channels: 1          # Number of active channels for event detection
  ch0_enable: 1               # Channel 0 (mains voltage) - enabled by default
  ch1_enable: 0               # Channel 1 - disabled by default
  ch2_enable: 0               # Channel 2 - disabled by default
  ch3_enable: 0               # Channel 3 - disabled by default
  ch4_enable: 0               # Channel 4 - disabled by default
  ch5_enable: 0               # Channel 5 - disabled by default
  ch6_enable: 0               # Channel 6 - disabled by default
  ch7_enable: 0               # Channel 7 - disabled by default
                              # Sampling Speed Improvement:
                                # Channels	Read Time	Possible Rate
                                # 1 (0x01)	~1 µs	~200 kHz
                                # 2 (0x03)	~2 µs	~167 kHz
                                # 4 (0x0F)	~4 µs	~125 kHz
                                # 8 (0xFF)	~8 µs	~83 kHz

# Detection Configuration
detection:
  ac_freq_hz: 60              # mains frequency (60 for NA, 50 for EU)
  rms_window_cycles: 1        # 1-cycle RMS for fast sag/swell onset tagging
  learn_cycles: 300           # auto-learn for about 5 seconds at 60Hz

# Anomaly Thresholds
anomalies:
  sag:
    threshold_pct: -10        # SAG threshold: 10% below nominal (IEEE 1159)
    min_duration_ms: 9        # ~0.5 cycle @ 60 Hz
  swell:
    threshold_pct: 10         # SWELL threshold: 10% above nominal (IEEE 1159)
    min_duration_ms: 9        # ~0.5 cycle @ 60 Hz
  spike:
    threshold_pct: 20
    max_duration_ms: 100

# Fixed professional-review policy (not user-editable via settings gear).
# Evaluated at read time from extreme RMS + duration; independent of log thresholds.
review:
  interruption_pct: 10        # extreme RMS <= 10% of nominal
  deep_sag_pct: 70            # extreme RMS <= 70% of nominal
  damaging_swell_pct: 120     # extreme RMS >= 120% of nominal
  sustained_duration_ms: 60000
  range_b_low_pct: -13.3      # ANSI C84.1 utilization Range B @ 120 V
  range_b_high_pct: 5.8

# Logging Configuration
logging:
  level: info                 # Log level: debug, info, warn, error

# Webapp Configuration
webapp:
  history_max_points: 20000   # ~1.1 h of 5 Hz IEC Vrms intervals on the trend chart
