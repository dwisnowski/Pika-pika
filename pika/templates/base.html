<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Pika-pika Live Monitor{% endblock %}</title>
    
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3.0.0/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.0.1/dist/chartjs-plugin-zoom.min.js"></script>
    
    <!-- Material CSS -->
    <link rel="stylesheet" href="{{ url_for('static', path='/material.css') }}">
    
    <!-- Favicons and manifest -->
    <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', path='/favicon-32x32.png') }}">
    <link rel="icon" type="image/png" sizes="16x16" href="{{ url_for('static', path='/favicon-16x16.png') }}">
    <link rel="apple-touch-icon" sizes="180x180" href="{{ url_for('static', path='/apple-touch-icon.png') }}">
    <link rel="icon" href="{{ url_for('static', path='/favicon.ico') }}" type="image/x-icon" />
    
    <!-- Open Graph / Social preview -->
    <meta property="og:title" content="Pika-pika" />
    <meta property="og:description" content="Python-based Raspberry Pi voltage logger and live web viewer." />
    <meta property="og:image" content="{{ url_for('static', path='/Pika-pika.png') }}" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="{{ url_for('static', path='/Pika-pika.png') }}" />
    
    <style>
        body { 
            font-family: 'Roboto', 'Noto Sans', sans-serif; 
            margin: 18px; 
        }
        #chartwrap { 
            max-width: 900px; 
        }
    </style>
    
    {% block extra_head %}{% endblock %}
</head>
<body>
    {% block content %}{% endblock %}
    
    {% block scripts %}{% endblock %}
</body>
</html>
