<!-- Header Component -->
<div class="header" style="gap:18px;align-items:center;">

    <div>
        <h2 style="margin:0">{{ page_title or "Pika-pika Live Voltage Monitor" }}</h2>
        <p style="margin:2px 0 0 0; font-size:90%">{{ page_description or "Shows recent sampled values (live). Data is sampled at 100 Hz and stored on device." }}</p>

</div>

<!-- Navigation -->

</div>
