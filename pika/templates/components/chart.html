<!-- Chart Component -->
<div style="display:flex;gap:24px;align-items:center;flex-wrap:wrap;">
    <div id="chartwrap" style="flex:1;min-width:320px;max-width:900px;">
        <!-- Controls -->
        <div style="display:flex;gap:12px;align-items:center;margin-bottom:8px;flex-wrap:wrap;">
            <div style="display:flex;gap:12px;align-items:center;">
                <label for="sampleRate" style="font-size:14px;">Sample Rate:</label>
                <input type="number" id="sampleRate" min="1" max="860" step="1"
                    style="width:80px;padding:4px;border:1px solid #ccc;border-radius:4px;">
                <span>Hz</span>
                <button id="updateRateBtn" class="btn" style="font-size:12px;padding:4px 8px;">Update</button>
                <div style="display:flex; gap:5px;">
                    <button id="resetView" class="btn secondary" style="font-size:12px;padding:4px 8px;">Reset
                        View</button>
                    <button id="settingsBtn" class="btn" style="font-size:12px;padding:4px 8px;">⚙️ Settings</button>
                </div>
                <span id="currentRate" style="font-size:12px;color:#666;"></span>
            </div>
            <div style="display:flex;gap:8px;align-items:center;margin-left:16px;">
                <label style="font-size:14px;">Time Window:</label>
                <label style="font-size:12px;cursor:pointer;"><input type="radio" name="timeWindow" value="1"
                        style="margin-right:4px;">1s</label>
                <label style="font-size:12px;cursor:pointer;"><input type="radio" name="timeWindow" value="3"
                        style="margin-right:4px;">3s</label>
                <label style="font-size:12px;cursor:pointer;"><input type="radio" name="timeWindow" value="10" checked
                        style="margin-right:4px;">10s</label>
                <label style="font-size:12px;cursor:pointer;"><input type="radio" name="timeWindow" value="30"
                        style="margin-right:4px;">30sec</label>
                <label style="font-size:12px;cursor:pointer;"><input type="radio" name="timeWindow" value="60"
                        style="margin-right:4px;">1min</label>
                <label style="font-size:12px;cursor:pointer;"><input type="radio" name="timeWindow" value="300"
                        style="margin-right:4px;">5min</label>
                <label style="font-size:12px;cursor:pointer;"><input type="radio" name="timeWindow" value="600"
                        style="margin-right:4px;">10min</label>
            </div>
            <div style="display:flex;gap:8px;align-items:center;margin-left:16px;">
                <label style="font-size:14px;">ADC Channel:</label>
                <label style="font-size:12px;cursor:pointer;"><input type="radio" name="adcChannel" value="0" checked
                        style="margin-right:4px;">A0</label>
                <label style="font-size:12px;cursor:pointer;"><input type="radio" name="adcChannel" value="1"
                        style="margin-right:4px;">A1</label>
                <label style="font-size:12px;cursor:pointer;"><input type="radio" name="adcChannel" value="2"
                        style="margin-right:4px;">A2</label>
                <label style="font-size:12px;cursor:pointer;"><input type="radio" name="adcChannel" value="3"
                        style="margin-right:4px;">A3</label>
            </div>
            <div
                style="display:flex;gap:16px;align-items:center;margin-left:auto;padding:4px 12px;background:rgba(255,255,255,0.05);border-radius:6px;border:1px solid rgba(255,255,255,0.1);">
                <div style="display:flex;flex-direction:column;align-items:center;">
                    <span style="font-size:10px;text-transform:uppercase;color:#aaa;letter-spacing:0.05em;">Min</span>
                    <span id="minVoltage"
                        style="font-size:16px;font-weight:600;color:#FF6B6B;font-family:monospace;">0.000V</span>
                </div>
                <div style="display:flex;flex-direction:column;align-items:center;">
                    <span style="font-size:10px;text-transform:uppercase;color:#aaa;letter-spacing:0.05em;">Max</span>
                    <span id="maxVoltage"
                        style="font-size:16px;font-weight:600;color:#90CAF9;font-family:monospace;">0.000V</span>
                </div>
            </div>
        </div>

        <!-- Chart Canvas -->
        <div style="position: relative; height: 350px; width: 100%;">
            <canvas id="chart"></canvas>
        </div>
    </div>
</div>
