site_name: Pika-pika
site_description: Python-based Raspberry Pi voltage logger
repo_url: https://github.com/dwisnowski/Pika-pika
repo_name: dwisnowski / Pika-pika
nav:
  - Home: index.md


theme:
  name: material
  language: en
  logo: images/logo.svg
  favicon: images/logo.svg
  features:
    - navigation.instant
    - navigation.sections.collapsible
    - content.code.copy
    - content.tooltips
  palette:
    - scheme: slate
      primary: '#FFD54A'
      accent: '#FF6B6B'
      toggle:
        icon: material/weather-night
        name: Switch to light theme
    - scheme: default
      primary: '#FFD54A'
      accent: '#FF6B6B'
      toggle:
        icon: material/weather-sunny
        name: Switch to dark theme

plugins:
  - glightbox:
      touchNavigation: true
      loop: true
      effect: zoom
      width: 100%
      height: auto
      zoomable: true
      draggable: true

markdown_extensions:
  - md_in_html
  - attr_list
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
