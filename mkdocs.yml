site_name: Pika-pika
site_description: Python-based Raspberry Pi voltage logger
repo_url: https://github.com/dwisnowski/Pika-pika
repo_name: dwisnowski / Pika-pika
nav:
  - Home: index.md
  - Hardware:
    - Parts: parts.md
    - Wiring steps: wiring-steps.md
    - Raspberry Pi Setup Guide: rpi-setup-guide.md
  - Demo: demo.md
  - README: README-synced.md

theme:
  name: material
  language: en
  logo: images/logo.svg
  favicon: images/logo.svg
  features:
    - navigation.instant
    - navigation.sections
    - content.code.copy
  palette:
    - scheme: slate
      primary: '#FFD54A'
      accent: '#FF6B6B'
      toggle:
        icon: material/weather-night
        name: Switch to light theme
    - scheme: default
      primary: '#FFD54A'
      accent: '#FF6B6B'
      toggle:
        icon: material/weather-sunny
        name: Switch to dark theme

