<?xml version="1.0" encoding="UTF-8"?>
<!-- Simple wiring diagram (illustrative only). Do NOT connect mains directly; follow safety guidelines. -->
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="480" viewBox="0 0 800 420">
  <style>
    .title { font: bold 16px sans-serif; fill: #f00; }
    .label { font: 12px sans-serif; }
    .pin { stroke: #333; fill: #eee; }
    .wire { stroke-width: 2px; stroke-linecap: round; }
    .g { stroke: #999; }
  </style>

  <text x="16" y="24" class="title">Raspberry Pi 2 - ADS1115 - ZMPT101B Wiring (illustrative)</text>

  <!-- Raspberry Pi outline -->
  <rect x="16" y="40" width="260" height="160" rx="8" fill="#e6f2ff" stroke="#1a73e8" />
  <text x="28" y="64" class="label">Raspberry Pi 2 (GPIO header)</text>
  <g transform="translate(32,80)">
    <rect x="0" y="0" width="220" height="110" fill="#fff" stroke="#ccc" />
    <!-- pins (simplified) -->
    <rect x="8" y="8" width="28" height="16" class="pin" />
    <text x="44" y="20" class="label">Pin 1: 3.3V</text>

    <rect x="8" y="32" width="28" height="16" class="pin" />
    <text x="44" y="44" class="label">Pin 3: SDA (GPIO2)</text>

    <rect x="8" y="56" width="28" height="16" class="pin" />
    <text x="44" y="68" class="label">Pin 5: SCL (GPIO3)</text>

    <rect x="8" y="80" width="28" height="16" class="pin" />
    <text x="44" y="92" class="label">Pin 6: GND</text>
  </g>

  <!-- ADS1115 -->
  <rect x="320" y="40" width="220" height="120" rx="8" fill="#fff7e6" stroke="#ff8c00" />
  <text x="336" y="64" class="label">ADS1115 (I2C ADC)</text>
  <text x="336" y="84" class="label">VCC -> 3.3V (Pin 1)</text>
  <text x="336" y="100" class="label">GND -> GND (Pin 6)</text>
  <text x="336" y="116" class="label">SDA -> SDA (Pin 3)</text>
  <text x="336" y="132" class="label">SCL -> SCL (Pin 5)</text>
  <text x="336" y="148" class="label">A0 -> ZMPT101B output</text>

  <!-- ZMPT101B -->
  <rect x="320" y="200" width="220" height="120" rx="8" fill="#f2fff0" stroke="#2e7d32" />
  <text x="336" y="224" class="label">ZMPT101B (AC voltage sensor)</text>
  <text x="336" y="240" class="label">VCC -> 5 V (use board 5V or external)</text>
  <text x="336" y="256" class="label">GND -> GND</text>
  <text x="336" y="272" class="label">Vout -> ADS1115 A0</text>

  <!-- wires -->
  <line x1="96" y1="96" x2="320" y2="96" class="wire" stroke="#1a73e8"/>
  <text x="180" y="88" class="label">3.3V</text>

  <line x1="96" y1="120" x2="320" y2="120" class="wire" stroke="#6ab04c"/>
  <text x="180" y="112" class="label">SDA</text>

  <line x1="96" y1="144" x2="320" y2="144" class="wire" stroke="#6ab04c"/>
  <text x="180" y="136" class="label">SCL</text>

  <line x1="96" y1="168" x2="320" y2="264" class="wire" stroke="#444"/>
  <text x="180" y="172" class="label">GND</text>

  <line x1="425" y1="264" x2="340" y2="150" class="wire" stroke="#ff5722"/>
  <text x="385" y="182" class="label" fill="#ff5722">Vout -> A0</text>

  <rect x="16" y="340" width="760" height="90" rx="8" fill="#fff" stroke="#ddd" />
  <text x="36" y="366" class="label">Notes:</text>
  <text x="36" y="382" class="label">- This diagram is illustrative only. Use proper isolation and a fuse when measuring mains voltage.</text>
  <text x="36" y="398" class="label">- ZMPT101B typically requires signal conditioning (bias) before feeding into ADC.</text>
  <text x="36" y="414" class="label">- Verify voltage ranges: never exceed ADC input limits. If unsure, use an isolation transformer or commercial sensor modules.</text>
</svg>
