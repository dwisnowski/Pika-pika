[pika]
# Sample rate in Hz (1-860)
sample_hz = 400

# Data directory for logs
data_dir = "data"

# Web server port
port = 8000

# Display settings
display_fps = 5.0
display_auto_ip = true

[pins]
# ADC Settings (ADS1115)
adc_address = 0x48
adc_channel = 0

# LCD Settings (ST7789)
lcd_port = 0
lcd_device = 0
lcd_cs = 8
lcd_dc = 25
lcd_rst = 27
lcd_bl = 24

[display]
rotation = 270
refresh_rate = 30
qr_size = 60

[voltage]
# ZMPT101B Calibration
# ADC peak-to-peak voltage when measuring 120VAC
# Adjust based on your sensor output
adc_vpp_to_ac_rms = 85.0
adc_offset = 1.65

# Brownout thresholds (ANSI C84.1 based for 120V nominal)
undervoltage_warning = 114
brownout = 108
severe_brownout = 95
dropout = 80
overvoltage_warning = 126
severe_overvoltage = 132

# Minimum duration to trigger event (milliseconds)
# 50ms = ~3 cycles at 60Hz
min_duration_ms = 50

[datalogger]
# Write to disk every N samples
batch_size = 400
# Or every N milliseconds, whichever comes first
batch_interval_ms = 1000

[analysis]
enable_rms = true
enable_freq = true
enable_sags_swells = true
