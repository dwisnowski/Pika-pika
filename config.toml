[pika]
# Sample rate in Hz (1-860)
sample_hz = 400

# Data directory for logs
data_dir = "data"

# Web server port
port = 8000

# Display settings
display_fps = 5.0
display_auto_ip = true

[pins]
# ADC Settings (ADS1115)
adc_type = "mock"  # Options: "ads1115", "mock"
adc_address = 0x48
adc_channel = 0

# Mock ADC Settings (for development/testing)
mock_signal_type = "ac"  # Options: "ac", "dc", "sine", "noise"
mock_amplitude = 1.0
mock_frequency = 60.0
mock_dc_offset = 1.5
mock_noise_level = 0.02

# LCD Settings (ST7789)
lcd_port = 0
lcd_device = 0
lcd_cs = 8
lcd_dc = 25
lcd_rst = 27
lcd_bl = 24

[display]
rotation = 270
refresh_rate = 30
qr_size = 60

[datalogger]
# Write to disk every N samples
batch_size = 400
# Or every N milliseconds, whichever comes first
batch_interval_ms = 1000

[analysis]
enable_rms = true
enable_freq = true
enable_sags_swells = true

[execution]
# Execution mode: "multiprocessing" or "threading"
mode = "threading"

[multiprocessing]
# Multiprocessing mode settings
shared_memory_names = { sample_buffer = "pika_samples", analysis_buffer = "pika_analysis", config_buffer = "pika_config" }
heartbeat_interval = 5.0
restart_delay = 2.0
max_restarts = 5
shutdown_timeout = 30.0

[threading]
# Threading mode settings
heartbeat_interval = 2.0
restart_delay = 1.0
max_restarts = 3
shutdown_timeout = 15.0

[systemd]
# Systemd watchdog settings
enable_watchdog = true
stale_threshold = 3.0